<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Totally normal platformer (TNP)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            flex-direction: column;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
            border: 4px solid #333;
        }
        canvas {
            display: block;
            background-color: #1a1a1a;
        }
        .ui-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 2px 2px 0px #000;
        }
        .seed-display {
            position: absolute;
            bottom: 12px;
            left: 15px;
            font-size: 14px;
            color: #aaa;
            font-family: monospace;
            pointer-events: none;
            text-shadow: 1px 1px 0px #000;
        }
        .settings-btn {
            position: absolute;
            top: 12px;
            right: 15px;
            background: #333;
            color: #fff;
            border: 2px solid #555;
            padding: 4px 10px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            pointer-events: auto;
            z-index: 10;
        }
        .settings-btn:hover {
            background: #444;
        }
        .settings-menu, .dialog-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.95);
            border: 2px solid #555;
            padding: 25px;
            border-radius: 8px;
            text-align: center;
            display: none;
            z-index: 20;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
            max-width: 400px;
        }
        .settings-menu h2, .dialog-box h2 {
            margin-top: 0;
            color: #ff3366;
        }
        .settings-menu label {
            display: block;
            margin: 15px 0;
            cursor: pointer;
            font-size: 16px;
        }
        .settings-menu button, .dialog-box button {
            background: #ff3366;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 10px;
            margin-right: 5px;
        }
        .settings-menu button:hover, .dialog-box button:hover {
            background: #e02e5b;
        }
        .dialog-box p {
            color: #ddd;
            font-size: 15px;
            line-height: 1.4;
        }
        .instructions {
            margin-top: 10px;
            font-size: 14px;
            color: #888;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="ui-overlay">
            <span id="ui-progress">Distance: 0m</span>
            <span id="ui-deaths">Deaths: 0</span>
        </div>
        <button class="settings-btn" id="settingsBtn">Settings (ESC)</button>
        <div id="ui-seed" class="seed-display">Seed: --</div>
        
        <div class="settings-menu" id="settingsMenu">
            <h2>Settings</h2>
            <label>
                <input type="checkbox" id="hitboxToggle"> Show Hitboxes
            </label>
            <label>
                <input type="checkbox" id="easyModeToggle"> Easy Mode (For the weak)
            </label>
            <br>
            <button id="closeSettings">Resume Game</button>
        </div>

        <div class="dialog-box" id="dialogBox">
            <h2>Are you sure about that?</h2>
            <p id="mockeryText">Really? Turning on Easy Mode? Do you need a safety blanket and a pacifier too? Fine, click confirm if your fingers are too tired to jump properly.</p>
            <button id="confirmEasy">Yes, I am bad</button>
            <button id="cancelEasy">No, take me back!</button>
        </div>

        <canvas id="gameCanvas" width="800" height="450"></canvas>
    </div>
    <div class="instructions">Controls: A/D or Arrow Keys to Move | W or Space to Jump | R to Restart Level</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // UI Elements
        const uiProgress = document.getElementById("ui-progress");
        const uiDeaths = document.getElementById("ui-deaths");
        const uiSeed = document.getElementById("ui-seed");
        const settingsBtn = document.getElementById("settingsBtn");
        const settingsMenu = document.getElementById("settingsMenu");
        const closeSettingsBtn = document.getElementById("closeSettings");
        const hitboxToggle = document.getElementById("hitboxToggle");
        const easyModeToggle = document.getElementById("easyModeToggle");
        const dialogBox = document.getElementById("dialogBox");
        const mockeryText = document.getElementById("mockeryText");
        const confirmEasy = document.getElementById("confirmEasy");
        const cancelEasy = document.getElementById("cancelEasy");

        // Game States
        const STATE = { START: 0, PLAYING: 1, TRANSITION: 2, VICTORY: 3, SETTINGS: 4, DIALOG: 5, LOADING: 6 };
        let gameState = STATE.START;
        let previousState = STATE.PLAYING;

        let totalDeaths = 0;
        let currentSeedVal = 0;
        let difficultyLevel = 1;

        // Settings config
        let settings = {
            showHitboxes: false,
            easyMode: false
        };

        // Loading screen transition tracking
        let loadingTimer = 0;
        let loadingMessage = "";

        // Player Object
        let player = {
            x: 50,
            y: 300,
            width: 24,
            height: 24,
            vx: 0,
            vy: 0,
            speed: 4.5,
            jumpForce: -10.5,
            gravity: 0.5,
            grounded: false,
            color: "#ff3366"
        };

        let keys = {};
        let platforms = [];
        let hazards = []; 
        let fakePlatforms = []; 
        let movingHazards = []; 
        let goal = {};

        let transitionQueue = [];
        let transitionTimer = 0;

        let shakeTimer = 0;
        let shakeMagnitude = 0;

        function triggerShake(duration, magnitude) {
            shakeTimer = duration;
            shakeMagnitude = magnitude;
        }

        const mockeryQuotes = [
            "Really? Turning on Easy Mode? Do you need a safety blanket and a pacifier too? Fine, click confirm if your fingers are too tired to jump properly.",
            "Oh look, someone couldn't handle a tiny jump! Want me to beat the game for you too, champ?",
            "Easy mode activated? Bold choice for someone who probably dies on flat ground.",
            "Ah, lowering the difficulty. Don't worry, your secret is safe with everyone who reads this code."
        ];

        const disableQuotes = [
            "Turning Easy Mode OFF? Look who decided to grow a backbone! Good luck out there.",
            "Removing training wheels. Try not to cry when you hit the first spike.",
            "Back to hard mode? Respectable. Let's see how long you survive."
        ];

        // Initialize / Generate World Chunk
        function generateChunk(startX, isInitial = false) {
            if (isInitial) {
                platforms = [];
                hazards = [];
                fakePlatforms = [];
                movingHazards = [];
                player.x = 50;
                player.y = 300;
                player.vx = 0;
                player.vy = 0;

                currentSeedVal = Math.floor(Math.random() * 899999 + 100000);
                uiSeed.innerText = `Seed: TNP-${currentSeedVal}`;
            }

            let seed = currentSeedVal + difficultyLevel * 99;
            function random() {
                let x = Math.sin(seed++) * 10000;
                return x - Math.floor(x);
            }

            if (isInitial) {
                platforms.push({ x: 0, y: 380, width: 160, height: 70, color: "#444" });
            }

            let currentX = startX;
            let lastY = platforms[platforms.length - 1].y;
            let chunkLength = 1200 + (difficultyLevel * 200);

            const maxJumpDistance = 110; 
            const maxVerticalStep = 95;

            while (currentX < startX + chunkLength) {
                let gap = 50 + random() * (maxJumpDistance - 50);
                let platWidth = 80 + random() * 70;
                let heightDelta = (random() - 0.5) * (maxVerticalStep * 1.5);
                let platY = lastY + heightDelta;

                if (platY < 130) platY = 130;
                if (platY > 380) platY = 380;

                let isFake = (random() < 0.22 && difficultyLevel > 1);

                if (isFake) {
                    fakePlatforms.push({ 
                        x: currentX + gap, 
                        y: platY, 
                        width: platWidth, 
                        height: 20,
                        state: 'normal', 
                        fadeTimer: 0 
                    });
                } else {
                    platforms.push({ x: currentX + gap, y: platY, width: platWidth, height: 20, color: "#666" });

                    if (random() < 0.35 && difficultyLevel > 1 && platWidth > 100) {
                        hazards.push({
                            x: currentX + gap + 15,
                            y: platY - 8,
                            width: platWidth - 30,
                            height: 8
                        });
                    }

                    if (random() < 0.25 && difficultyLevel > 2) {
                        movingHazards.push({
                            x: currentX + gap - gap / 2,
                            y: 160 + random() * 140,
                            startY: 110,
                            endY: 340,
                            speed: 1.5 + difficultyLevel * 0.3,
                            dir: 1,
                            radius: 11
                        });
                    }
                }

                currentX += gap + platWidth;
                lastY = platY;
            }

            goal = { x: currentX + 50, y: 320, width: 30, height: 60 };
            platforms.push({ x: currentX, y: 380, width: 220, height: 70, color: "#444" });
        }

        // Trigger loading screen reset sequence
        function triggerLoadingScreen(enable) {
            settings.easyMode = enable;
            easyModeToggle.checked = enable;
            
            let quoteList = enable ? mockeryQuotes : disableQuotes;
            loadingMessage = quoteList[Math.floor(Math.random() * quoteList.length)];
            
            settingsMenu.style.display = "none";
            dialogBox.style.display = "none";
            gameState = STATE.LOADING;
            loadingTimer = 120; 
        }

        // Settings and Dialog UI Handlers
        function toggleSettings() {
            if (gameState === STATE.SETTINGS) {
                gameState = previousState;
                settingsMenu.style.display = "none";
            } else if (gameState === STATE.PLAYING || gameState === STATE.START) {
                previousState = gameState;
                gameState = STATE.SETTINGS;
                settingsMenu.style.display = "block";
            }
        }

        settingsBtn.addEventListener("click", toggleSettings);
        closeSettingsBtn.addEventListener("click", toggleSettings);
        
        hitboxToggle.addEventListener("change", (e) => {
            settings.showHitboxes = e.target.checked;
        });

        easyModeToggle.addEventListener("click", (e) => {
            e.preventDefault();

            if (!settings.easyMode) {
                let randomQuote = mockeryQuotes[Math.floor(Math.random() * mockeryQuotes.length)];
                mockeryText.innerText = randomQuote;
                settingsMenu.style.display = "none";
                dialogBox.style.display = "block";
                previousState = gameState;
                gameState = STATE.DIALOG;
            } else {
                triggerLoadingScreen(false);
            }
        });

        confirmEasy.addEventListener("click", () => {
            triggerLoadingScreen(true);
        });

        cancelEasy.addEventListener("click", () => {
            dialogBox.style.display = "none";
            settingsMenu.style.display = "block";
            gameState = STATE.SETTINGS;
        });

        // Input Listeners
        window.addEventListener("keydown", (e) => {
            keys[e.code] = true;

            if (e.code === "Escape") {
                if (gameState === STATE.PLAYING || gameState === STATE.SETTINGS) {
                    toggleSettings();
                }
                return;
            }

            if (e.code === "KeyR" && gameState !== STATE.SETTINGS && gameState !== STATE.DIALOG && gameState !== STATE.LOADING) {
                if (gameState === STATE.PLAYING || gameState === STATE.GAME_OVER) {
                    totalDeaths++;
                    triggerShake(15, 5);
                    difficultyLevel = 1;
                    generateChunk(160, true);
                    gameState = STATE.PLAYING;
                }
            }

            if (gameState === STATE.START && (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW")) {
                difficultyLevel = 1;
                totalDeaths = 0;
                generateChunk(160, true);
                gameState = STATE.PLAYING;
            }
        });

        window.addEventListener("keyup", (e) => {
            keys[e.code] = false;
        });

        function resetPlayer() {
            totalDeaths++;
            triggerShake(20, 8);
            difficultyLevel = 1;
            generateChunk(160, true);
        }

        function getHazardBounds(h) {
            let spikeWidth = 8;
            let count = Math.floor(h.width / spikeWidth);
            if (settings.easyMode) {
                count = Math.floor(count * 0.5);
            }
            let activeWidth = count * spikeWidth;
            return { x: h.x, y: h.y, width: activeWidth, height: h.height };
        }

        // Game Loop Update
        function update() {
            if (gameState === STATE.LOADING) {
                loadingTimer--;
                if (loadingTimer <= 0) {
                    difficultyLevel = 1;
                    generateChunk(160, true);
                    gameState = STATE.PLAYING;
                }
                return;
            }

            if (gameState !== STATE.PLAYING && gameState !== STATE.TRANSITION) return;

            let isMovingHorizontal = keys["ArrowLeft"] || keys["KeyA"] || keys["ArrowRight"] || keys["KeyD"];

            if (gameState === STATE.PLAYING) {
                player.vx = 0;
                if (keys["ArrowLeft"] || keys["KeyA"]) player.vx = -player.speed;
                if (keys["ArrowRight"] || keys["KeyD"]) player.vx = player.speed;

                player.x += player.vx;

                for (let p of platforms) {
                    if (
                        player.x < p.x + p.width &&
                        player.x + player.width > p.x &&
                        player.y < p.y + p.height &&
                        player.y + player.height > p.y
                    ) {
                        if (player.vx > 0) player.x = p.x - player.width;
                        if (player.vx < 0) player.x = p.x + player.width;
                    }
                }

                player.vy += player.gravity;
                player.y += player.vy;
                player.grounded = false;

                for (let p of platforms) {
                    if (
                        player.x < p.x + p.width &&
                        player.x + player.width > p.x &&
                        player.y < p.y + p.height &&
                        player.y + player.height > p.y
                    ) {
                        if (player.vy > 0) { 
                            player.y = p.y - player.height;
                            player.vy = 0;
                            player.grounded = true;
                        } else if (player.vy < 0) { 
                            player.y = p.y + p.height;
                            player.vy = 0;
                        }
                    }
                }

                // Susforms Check: Easy Mode keeps the collision solid until the 0.5s fade completes
                for (let i = fakePlatforms.length - 1; i >= 0; i--) {
                    let fp = fakePlatforms[i];
                    
                    let canCollide = settings.easyMode ? true : (fp.state === 'normal');

                    if (
                        canCollide &&
                        player.x < fp.x + fp.width &&
                        player.x + player.width > fp.x &&
                        player.y + player.height >= fp.y &&
                        player.y + player.height <= fp.y + 10 &&
                        player.vy >= 0
                    ) {
                        if (isMovingHorizontal) {
                            if (fp.state === 'normal') {
                                fp.state = 'fading';
                                fp.fadeTimer = 30; // 0.5 seconds @ 60fps
                            }
                        } else {
                            if (fp.state === 'fading' && !settings.easyMode) {
                                fp.state = 'normal';
                                fp.fadeTimer = 0;
                            }
                            player.y = fp.y - player.height;
                            player.vy = 0;
                            player.grounded = true;
                        }
                    }

                    if (fp.state === 'fading') {
                        fp.fadeTimer--;
                        if (fp.fadeTimer <= 0) {
                            fakePlatforms.splice(i, 1);
                            triggerShake(10, 3);
                        }
                    }
                }

                if ((keys["ArrowUp"] || keys["KeyW"] || keys["Space"]) && player.grounded) {
                    player.vy = player.jumpForce;
                    player.grounded = false;
                }

                for (let h of hazards) {
                    let hb = getHazardBounds(h);
                    if (
                        player.x < hb.x + hb.width &&
                        player.x + player.width > hb.x &&
                        player.y < hb.y + hb.height &&
                        player.y + player.height > hb.y
                    ) {
                        resetPlayer();
                    }
                }

                for (let mh of movingHazards) {
                    mh.y += mh.speed * mh.dir;
                    if (mh.y < mh.startY || mh.y > mh.endY) mh.dir *= -1;

                    let distX = Math.abs(player.x + player.width / 2 - mh.x);
                    let distY = Math.abs(player.y + player.height / 2 - mh.y);

                    if (distX < mh.radius + player.width / 2 && distY < mh.radius + player.height / 2) {
                        resetPlayer();
                    }
                }

                if (player.y > canvas.height + 50) {
                    resetPlayer();
                }

                if (
                    player.x < goal.x + goal.width &&
                    player.x + player.width > goal.x &&
                    player.y < goal.y + goal.height &&
                    player.y + player.height > goal.y
                ) {
                    gameState = STATE.TRANSITION;
                    difficultyLevel++;
                    triggerShake(15, 3);

                    let endPlatform = platforms[platforms.length - 1];
                    transitionQueue = platforms.slice(0, platforms.length - 1);
                    platforms = [endPlatform]; 
                    hazards = []; 
                    fakePlatforms = [];
                    movingHazards = [];
                    transitionTimer = 0;
                }
            } else if (gameState === STATE.TRANSITION) {
                transitionTimer++;
                if (transitionTimer % 4 === 0 && transitionQueue.length > 0) {
                    transitionQueue.shift(); 
                }

                if (transitionQueue.length === 0) {
                    let lastPlatform = platforms[platforms.length - 1];
                    generateChunk(lastPlatform.x + lastPlatform.width);
                    gameState = STATE.PLAYING;
                }
            }

            uiProgress.innerText = `Distance: ${Math.floor(player.x)}m`;
            uiDeaths.innerText = `Deaths: ${totalDeaths}`;
        }

        // Render Graphics
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameState === STATE.LOADING) {
                ctx.fillStyle = "#111";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ff3366";
                ctx.font = "bold 26px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("APPLYING DIFFICULTY SETTINGS...", canvas.width / 2, canvas.height / 2 - 50);

                ctx.fillStyle = "#fff";
                ctx.font = "16px sans-serif";
                ctx.fillText(`"${loadingMessage}"`, canvas.width / 2, canvas.height / 2 + 10);
                
                ctx.fillStyle = "#333";
                ctx.fillRect(canvas.width / 2 - 150, canvas.height / 2 + 50, 300, 10);
                ctx.fillStyle = "#ff3366";
                let progressWidth = ((120 - loadingTimer) / 120) * 300;
                ctx.fillRect(canvas.width / 2 - 150, canvas.height / 2 + 50, progressWidth, 10);

                return;
            }

            ctx.save();
            if (shakeTimer > 0) {
                shakeTimer--;
                let offsetX = (Math.random() - 0.5) * shakeMagnitude;
                let offsetY = (Math.random() - 0.5) * shakeMagnitude;
                ctx.translate(offsetX, offsetY);
            }

            if (gameState === STATE.START) {
                ctx.fillStyle = "#ff3366";
                ctx.font = "bold 32px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("Totally normal platformer (TNP)", canvas.width / 2, canvas.height / 2 - 30);
                
                ctx.fillStyle = "#aaa";
                ctx.font = "16px sans-serif";
                ctx.fillText("Press SPACE or UP to Start Your Pain", canvas.width / 2, canvas.height / 2 + 20);
                ctx.restore();
                return;
            }

            let cameraX = player.x - 200;
            if (cameraX < 0) cameraX = 0;

            ctx.save();
            ctx.translate(-cameraX, 0);

            ctx.strokeStyle = "#222";
            ctx.lineWidth = 1;
            for (let i = 0; i < player.x + 2000; i += 100) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }

            for (let p of transitionQueue) {
                ctx.fillStyle = "#444";
                ctx.fillRect(p.x, p.y, p.width, p.height);
                ctx.strokeStyle = "#ff3333";
                ctx.strokeRect(p.x, p.y, p.width, p.height);
            }

            for (let p of platforms) {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.width, p.height);
                ctx.strokeStyle = "#222";
                ctx.strokeRect(p.x, p.y, p.width, p.height);
                if (settings.showHitboxes) {
                    ctx.strokeStyle = "#00ff00";
                    ctx.strokeRect(p.x, p.y, p.width, p.height);
                }
            }

            for (let fp of fakePlatforms) {
                if (fp.state === 'fading') {
                    let ratio = fp.fadeTimer / 30;
                    ctx.fillStyle = ratio > 0.5 ? "#e67e22" : "#e74c3c";
                } else {
                    ctx.fillStyle = "#2ecc71";
                }
                ctx.fillRect(fp.x, fp.y, fp.width, fp.height);
                ctx.strokeStyle = "#27ae60";
                ctx.strokeRect(fp.x, fp.y, fp.width, fp.height);

                if (settings.showHitboxes) {
                    // Show green active hitbox while readable by collision system
                    let activeHitbox = settings.easyMode ? true : (fp.state === 'normal');
                    ctx.strokeStyle = activeHitbox ? "#00ff00" : "#ff0000";
                    ctx.strokeRect(fp.x, fp.y, fp.width, fp.height);
                }
            }

            ctx.fillStyle = "#ff2222";
            for (let h of hazards) {
                ctx.beginPath();
                let spikeWidth = 8;
                let count = Math.floor(h.width / spikeWidth);
                
                if (settings.easyMode) {
                    count = Math.floor(count * 0.5);
                }

                for (let i = 0; i < count; i++) {
                    let sx = h.x + (i * spikeWidth);
                    ctx.moveTo(sx, h.y + h.height);
                    ctx.lineTo(sx + spikeWidth / 2, h.y);
                    ctx.lineTo(sx + spikeWidth, h.y + h.height);
                }
                ctx.fill();

                if (settings.showHitboxes) {
                    let hb = getHazardBounds(h);
                    ctx.strokeStyle = "#00ff00";
                    ctx.strokeRect(hb.x, hb.y, hb.width, hb.height);
                }
            }

            for (let mh of movingHazards) {
                ctx.fillStyle = "#ffcc00";
                ctx.beginPath();
                ctx.arc(mh.x, mh.y, mh.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "#111";
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.fillStyle = "#111";
                ctx.beginPath();
                ctx.arc(mh.x, mh.y, 4, 0, Math.PI * 2);
                ctx.fill();

                if (settings.showHitboxes) {
                    ctx.strokeStyle = "#00ff00";
                    ctx.beginPath();
                    ctx.arc(mh.x, mh.y, mh.radius, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }

            if (gameState === STATE.PLAYING) {
                ctx.fillStyle = "#33ccff";
                ctx.fillRect(goal.x, goal.y, goal.width, goal.height);
                ctx.fillStyle = "#ffffff";
                ctx.font = "10px sans-serif";
                ctx.fillText("EXIT", goal.x + 3, goal.y + 35);
                if (settings.showHitboxes) {
                    ctx.strokeStyle = "#00ff00";
                    ctx.strokeRect(goal.x, goal.y, goal.width, goal.height);
                }
            }

            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 2;
            ctx.strokeRect(player.x, player.y, player.width, player.height);

            if (settings.showHitboxes) {
                ctx.strokeStyle = "#00ff00";
                ctx.lineWidth = 1;
                ctx.strokeRect(player.x, player.y, player.width, player.height);
            }

            ctx.restore();
            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
